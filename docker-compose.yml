services:
  strm-webdav:
    build: .
    container_name: strm-webdav-server
    restart: unless-stopped
    ports:
      - "${WEBDAV_PORT:-1900}:1900"
    environment:
      - API_KEY=${API_KEY}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-300000}
      - WEBDAV_PORT=1900
      - STRM_DIR=/app/strm-files
    volumes:
      # Persist .strm files outside container
      - ./strm-files:/app/strm-files
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1900/webdav/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
